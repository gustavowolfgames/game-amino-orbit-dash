name: Quality Checks

on:
  # No branches filter: stacked PRs target branches in the stack, and a
  # base-filtered workflow would run no checks at all on them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent checks
        run: bun run check:agent

      - name: Type check
        run: bun run typecheck:baseline

      - name: Test
        run: bun run test:run

      - name: Create .env for the build
        # The build refuses to run without a .env file and a fresh checkout has
        # none. These placeholders only serve this compile check: nothing deploys.
        run: printf 'VITE_GAME_KIT_PROJECT_ID=ci-build\nVITE_GAME_KIT_ENV=Development\n' > .env

      - name: Build
        run: bun run build
